<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Total de Tarefas</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="text-4xl font-bold mt-4">{{ totalTasks() }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>Pendentes</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="text-4xl font-bold mt-4 text-orange-500">{{ pendingTasks() }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>Concluídas</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="text-4xl font-bold mt-4 text-green-600">{{ completedTasks() }}</p>
    </mat-card-content>
  </mat-card>
</div>

<div class="flex gap-4 mt-6">
  <button mat-raised-button (click)="addTask()">+ Nova Tarefa</button>
  <button mat-raised-button color="primary" (click)="completeTask()">✓ Concluir Tarefa</button>
</div>
