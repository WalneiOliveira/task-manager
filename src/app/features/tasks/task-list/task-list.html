@if (loading()) {
  <div class="flex justify-center items-center h-48">
    <mat-spinner />
  </div>
} @else if (error()) {
  <div class="p-4 bg-red-50 text-red-600 rounded-lg">
    {{ error() }}
  </div>
} @else {
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Tarefas</h1>
    <button mat-raised-button color="primary">
      <mat-icon>add</mat-icon>
      Nova Tarefa
    </button>
  </div>

  <mat-table [dataSource]="tasks()" class="w-full shadow-sm">

    <!-- Título -->
    <ng-container matColumnDef="title">
      <mat-header-cell *matHeaderCellDef>Tarefa</mat-header-cell>
      <mat-cell *matCellDef="let task">
        <span class="font-medium">{{ task.title }}</span>
      </mat-cell>
    </ng-container>

    <!-- Prioridade -->
    <ng-container matColumnDef="priority">
      <mat-header-cell *matHeaderCellDef>Prioridade</mat-header-cell>
      <mat-cell *matCellDef="let task">
        <span class="px-2 py-1 rounded-full text-xs font-medium"
          [class.bg-red-100]="task.priority === 'high'"
          [class.text-red-700]="task.priority === 'high'"
          [class.bg-yellow-100]="task.priority === 'medium'"
          [class.text-yellow-700]="task.priority === 'medium'"
          [class.bg-green-100]="task.priority === 'low'"
          [class.text-green-700]="task.priority === 'low'">
          {{ getPriorityLabel(task.priority) }}
        </span>
      </mat-cell>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let task">
        <mat-chip [color]="getStatusColor(task.status)" highlighted>
          {{ getStatusLabel(task.status) }}
        </mat-chip>
      </mat-cell>
    </ng-container>

    <!-- Data -->
    <ng-container matColumnDef="createdAt">
      <mat-header-cell *matHeaderCellDef>Criada em</mat-header-cell>
      <mat-cell *matCellDef="let task">
        {{ task.createdAt | date:'dd/MM/yyyy' }}
      </mat-cell>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef></mat-header-cell>
      <mat-cell *matCellDef="let task" class="flex gap-2">
        @if (task.status !== 'completed') {
          <button mat-icon-button
            color="primary"
            title="Concluir"
            (click)="completeTask(task)">
            <mat-icon>check_circle</mat-icon>
          </button>
        }
        <button mat-icon-button
          color="warn"
          title="Excluir"
          (click)="deleteTask(task)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

  </mat-table>
}
